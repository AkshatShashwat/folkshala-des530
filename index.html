<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folkshala AI dashboard demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2292%22%20height%3D%2292%22%20fill%3D%22%23FFF8EC%22%20stroke%3D%22%231E1A16%22%20stroke-width%3D%224%22%20stroke-dasharray%3D%228%205%22/%3E%3Crect%20x%3D%2214%22%20y%3D%2214%22%20width%3D%2272%22%20height%3D%2272%22%20rx%3D%228%22%20fill%3D%22%2326338C%22%20stroke%3D%22%231E1A16%22%20stroke-width%3D%224%22/%3E%3Cpath%20d%3D%22M14%2034%20l9%20-9%20l9%209%20l9%20-9%20l9%209%20l9%20-9%20l9%209%20l9%20-9%20l4%204%22%20fill%3D%22none%22%20stroke%3D%22%23E5A11B%22%20stroke-width%3D%224%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2262%22%20r%3D%2214%22%20fill%3D%22%23B83A2B%22%20stroke%3D%22%231E1A16%22%20stroke-width%3D%223%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Mukta:wght@400;600;700&family=Shrikhand&family=Yatra+One&display=swap" rel="stylesheet">
<style>/*
Two registers, one brand.
Adults (teacher, educator, school, funder): calm product UI, white cards, hairlines, one cutout per page.
Children (Teach mode on the class screen) + landing hero: the deck's poster world, textured paper, Shrikhand, folk cutouts.
Colour meanings never change: indigo = AI, sindoor = humans, patta = kit, haldi = money / assumptions, gulabi = decor.
*/
:root{color-scheme:light;
  --neel:#26338C;--sindoor:#B83A2B;--patta:#1D5B30;--haldi:#E5A11B;--ink:#1E1A16;--gulabi:#E98A9A;
  --paper:#F4EFE6;--card:#FFFFFF;--cream:#FFF8EC;--muted:#6B6157;--line:rgba(30,26,22,.10);--line2:rgba(30,26,22,.16);--fill:#F1ECE3;
  --t-ai:#E9EBF6;--t-hu:#F8E7E3;--t-kit:#E3EEE6;--t-hal:#FCEFD2;
  --ui:'Schibsted Grotesk','Mukta',system-ui,-apple-system,sans-serif;--display:'Shrikhand','Schibsted Grotesk',serif;--logo:'Yatra One','Mukta',serif;--hindi:'Mukta','Schibsted Grotesk',sans-serif;
  --r:18px;--shadow:0 1px 1px rgba(30,26,22,.04),0 12px 32px -16px rgba(30,26,22,.22)}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;color:var(--ink);font:400 15.5px/1.55 var(--ui);background:var(--paper);overflow-x:clip;-webkit-font-smoothing:antialiased}
/* faint paper grain, no figures */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;background:url(img/kraft.webp) center/cover;mix-blend-mode:multiply}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--neel);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip:focus{position:fixed;width:auto;height:auto;clip:auto;left:12px;top:12px;z-index:60;background:var(--ink);color:var(--cream);padding:8px 12px;border-radius:8px}
[lang=hi],[lang=bho]{font-family:var(--hindi)}
.frame,.app{position:relative;z-index:1;min-height:100vh}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap;
  background:rgba(247,243,236,.82);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.logo svg{border-radius:10px}
.logo .w{line-height:1;display:block;white-space:nowrap}
.fo{font-family:var(--logo);color:var(--sindoor)}.sh{font-family:var(--display);color:var(--neel)}
.logo .fo{font-size:24px}.logo .sh{font-size:20px;margin-left:1px}
.logo .tag{display:block;font-size:9.5px;font-weight:600;letter-spacing:2px;color:var(--muted);margin-top:3px}
.roles{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;justify-content:center;background:rgba(30,26,22,.06);border-radius:14px;padding:3px}
.roles::-webkit-scrollbar{display:none}
.roles a{flex:none;min-height:40px;display:inline-flex;align-items:center;padding:0 13px;border-radius:11px;text-decoration:none;color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.roles a:hover{background:rgba(255,255,255,.6)}
.roles a[aria-current="page"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);font-weight:600}
.status{display:flex;gap:8px;align-items:center;flex:none}
.online{font-size:12.5px;font-weight:600;color:var(--patta);border:0;border-radius:999px;padding:6px 12px;background:var(--t-kit);min-height:34px}
.online.off{color:var(--muted);background:var(--fill)}
@media(max-width:1480px){.roles{order:3;flex:1 1 100%;justify-content:flex-start}.status{margin-left:auto}.top{row-gap:8px;padding:8px 24px}}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.6px;white-space:nowrap;line-height:1.7;text-transform:uppercase}
.c-ai{background:var(--t-ai);color:var(--neel)}.c-hu{background:var(--t-hu);color:var(--sindoor)}
.c-kit{background:var(--t-kit);color:var(--patta)}.c-con,.c-as{background:var(--t-hal);color:#6b4a00}
.c-sch{background:var(--ink);color:var(--cream)}
.c-tg{background:transparent;color:var(--ink);border:1.5px dashed var(--muted);padding:1px 8px}
.c-demo{background:var(--fill);color:var(--muted)}
.c-mut{background:var(--fill);color:var(--muted)}

/* ---------- page + headings ---------- */
main{position:relative;z-index:1}
.page{max-width:1200px;margin:0 auto;padding:28px 24px 0}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:12px 0 22px}
.stag{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--cream);border-radius:999px;padding:3px 12px 3px 4px;font-weight:600;letter-spacing:1.6px;font-size:11px;text-transform:uppercase}
.stag b{background:var(--haldi);color:var(--ink);border-radius:999px;padding:0 8px;letter-spacing:0}
h1,h2,h3{font-family:var(--ui);margin:0;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(30px,3.6vw,46px);font-weight:800;margin-top:14px}
h1 .bar,h2 .bar{color:var(--muted);font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.lede{color:var(--muted);max-width:62ch;margin:12px 0 0;font-size:16.5px}
.hi{font-size:13.5px;color:var(--muted)}
.headart{position:relative;width:210px;height:200px;display:grid;place-items:end center}
.headart .disc{position:absolute;width:170px;height:170px;right:6px;top:6px;border-radius:50%;background:var(--c,var(--haldi))}
.headart img{position:relative;max-width:100%;max-height:200px;filter:drop-shadow(0 10px 16px rgba(30,26,22,.22))}
.headart.tilt img{transform:rotate(-6deg)}
@media(max-width:760px){.head{grid-template-columns:1fr}.headart{display:none}}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:980px){.g4,.g5,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;position:relative}
.card.flat{box-shadow:none;background:rgba(255,255,255,.6)}
.card .ct{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lab,.kl{font-size:12.5px;font-weight:600;color:var(--muted)}
.lab{text-transform:uppercase;letter-spacing:1.2px;font-size:11px}
.big{font-family:var(--ui);font-weight:700;font-size:36px;line-height:1.05;letter-spacing:-.03em}
.kpi .big{margin:6px 0 2px}
.kpi .row{margin-top:10px}
.zig{height:1px;background:var(--line);margin:28px 0}
.stampwrap{height:100%}
.stamp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);height:100%;position:relative;overflow:hidden}
.stamp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc,var(--haldi))}
.stamp .in{padding:20px 22px 20px 26px;height:100%}

.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 18px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink);transition:background .15s,transform .1s}
.btn:hover{background:#faf7f2}
.btn:active{transform:scale(.98)}
.btn.red{background:var(--sindoor);border-color:var(--sindoor);color:#fff}.btn.ind{background:var(--neel);border-color:var(--neel);color:#fff}
.btn.grn{background:var(--patta);border-color:var(--patta);color:#fff}.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.hal{background:var(--haldi);border-color:var(--haldi);color:var(--ink)}
.btn.red:hover,.btn.ind:hover,.btn.grn:hover,.btn.ink:hover,.btn.hal:hover{filter:brightness(1.07)}
.btn.lg{min-height:50px;font-size:16px;padding:10px 24px;border-radius:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[aria-pressed="true"],.btn[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}

.foot{position:relative;z-index:1;margin-top:48px;border-top:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .fl{font-weight:600;letter-spacing:1.4px;color:var(--ink)}
.foot .fo{font-size:15px;letter-spacing:0}.foot .sh{letter-spacing:0;font-size:13px}

/* ---------- landing hero (poster world) ---------- */
.hero{position:relative;overflow:hidden;color:var(--cream);background:#1f2a78 url(img/indigo.webp) center/cover}
.hero::before,.hero::after{content:"";position:absolute;left:0;right:0;height:46px;background:url(img/band.webp) center/auto 100% repeat-x;z-index:1}
.hero::before{top:0}.hero::after{bottom:0}
.hero .in{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:80px 24px 84px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;min-height:600px}
.hero .bigw{line-height:.92;margin:8px 0 0}
.hero .bigw .fo{display:block;font-size:clamp(84px,10vw,140px);color:var(--haldi);text-shadow:5px 5px 0 var(--ink)}
.hero .bigw .sh{display:block;font-size:clamp(60px,7.2vw,104px);color:var(--cream);text-shadow:5px 5px 0 var(--ink);margin-top:-4px}
.hero .eyebrow{margin-bottom:22px;font-size:12px;font-weight:700;letter-spacing:4px;color:var(--haldi)}
.hero .hindi{font-family:var(--hindi);font-weight:600;font-size:20px;color:var(--haldi);margin:16px 0 2px}
.hero .tagl{font-family:var(--display);font-size:clamp(20px,2.2vw,27px);line-height:1.3;margin:4px 0 14px}
.hero p.sub{max-width:50ch;opacity:.9;margin:0 0 24px}
.hero .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5);color:#fff}
.collage{position:relative;height:460px}
.collage img{position:absolute;filter:drop-shadow(0 16px 22px rgba(0,0,0,.35))}
.collage .hanu{left:2%;top:0;width:44%;transform:rotate(-7deg)}
.collage .anna{right:0;top:-10px;width:40%;transform:rotate(6deg)}
.collage .maha{right:6%;bottom:-30px;width:46%}
.collage .flw{left:46%;top:6px;width:11%;transform:rotate(-12deg)}
.collage .drum{left:0;bottom:-34px;width:44%}
@media(max-width:900px){.hero .in{grid-template-columns:1fr;min-height:0}.collage{height:380px;max-width:520px}}
.credit{font-size:11.5px;color:var(--muted);margin-top:10px}

.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.steps3>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;display:flex;gap:14px;align-items:flex-start;font-weight:700;font-size:18px;letter-spacing:-.01em}
.steps3 small{display:block;font-weight:400;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:4px}
.sym{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:18px}
@media(max-width:760px){.steps3{grid-template-columns:1fr}}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;overflow-x:auto;padding:4px 2px 14px}
.stepper button{flex:none;display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 4px;min-height:44px;font-weight:600;font-size:14px;color:var(--muted)}
.stepper .d{width:26px;height:26px;transform:rotate(45deg);border-radius:7px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;flex:none}
.stepper .d span{transform:rotate(-45deg);font-weight:700;font-size:12px}
.stepper .on{color:var(--ink)}.stepper .on .d{background:var(--haldi);border-color:var(--haldi)}
.stepper .done .d{background:var(--ink);border-color:var(--ink);color:#fff}
.stepper .lk{opacity:.5}
.stepper .chain{flex:1 1 24px;min-width:18px;height:1.5px;background:var(--line2);margin:0 4px}

/* ---------- forms ---------- */
.need{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:background .15s}
.need.on{background:var(--t-hu);border-color:rgba(184,58,43,.25)}
.need label{display:flex;align-items:center;gap:12px;font-weight:600;min-height:32px;cursor:pointer}
.need input[type=checkbox]{width:20px;height:20px;accent-color:var(--sindoor)}
.cnt{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:12px;padding:2px}
.need.on .cnt{background:rgba(255,255,255,.7)}
.cnt button{width:36px;height:36px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:17px}
.cnt button:hover{background:#fff}
.cnt output{min-width:22px;text-align:center;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.field input,.field select,.field textarea,select{min-height:44px;border:1px solid var(--line2);border-radius:12px;background:#fff;padding:8px 12px;font-size:15px;font-weight:400}
textarea{resize:vertical}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;background:var(--t-hu);font-weight:600;font-size:14px;color:#7a2318}
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:16px}
.tabs button{min-height:38px;padding:4px 14px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.story{cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.story:hover{transform:translateY(-2px)}
.story[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--sindoor),var(--shadow)}
.story[aria-disabled="true"]{opacity:.55}
.story h3{font-size:17px}
.rec{position:absolute;top:-10px;right:14px}

.pipe{display:flex;flex-direction:column;gap:8px}
.pstep{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--fill)}
.pstep .tk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#fff;font-size:13px}
.pstep.run{background:var(--t-ai)}
.pstep.run .tk{border:2px solid var(--neel);border-right-color:transparent;animation:spin 1s linear infinite}
.pstep.ok .tk{background:var(--neel);color:#fff}
.progress{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:14px 0 4px}
.progress i{display:block;height:100%;background:var(--neel);border-radius:99px;transition:width .6s}
@keyframes spin{to{transform:rotate(360deg)}}

.diff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:760px){.diff{grid-template-columns:1fr}}
.beat{border-left:3px solid var(--line2);padding:8px 12px;margin:8px 0;background:#faf8f4;border-radius:0 10px 10px 0;font-size:14.5px}
.beat.chg{border-left-color:var(--neel);background:var(--t-ai)}
.beat .bt{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted);margin-bottom:2px}
.beat [contenteditable="true"]{outline:1.5px dashed var(--sindoor);border-radius:6px;background:#fff;padding:2px 4px}
.flag{border-radius:14px;padding:12px 14px;background:var(--t-hal);font-size:14.5px}
.flag.res{background:var(--t-kit)}
.stampmark{position:absolute;right:-12px;top:-22px;z-index:3;transform:rotate(-10deg);border:3px double var(--sindoor);color:var(--sindoor);font-family:var(--display);font-size:17px;padding:4px 12px;border-radius:10px;background:#fff;text-align:center;line-height:1.15;box-shadow:0 6px 16px rgba(184,58,43,.2)}
.stampmark small{display:block;font-family:var(--ui);font-weight:600;font-size:10.5px}

/* ---------- Teach mode: the screen children see (poster world) ---------- */
.stage{position:relative;overflow:hidden;border-radius:24px;color:var(--cream);background:#1f2a78 url(img/indigo.webp) center/cover;padding:58px 26px 30px;box-shadow:0 20px 50px -20px rgba(20,24,70,.6)}
.stage::before{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:url(img/band.webp) center/auto 100% repeat-x}
.stage .flw{position:absolute;width:56px;top:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.stage .flw.l{left:14px;transform:rotate(-14deg)}.stage .flw.r{right:14px;transform:scaleX(-1) rotate(-14deg)}
.stage .stitle{font-family:var(--display);font-size:clamp(24px,2.6vw,34px);text-shadow:3px 3px 0 var(--ink);text-align:center;margin:0 0 4px}
.stage .ssub{text-align:center;color:var(--haldi);font-weight:600;letter-spacing:2px;font-size:12px;text-transform:uppercase;margin-bottom:18px}
.bcard{position:relative;color:var(--ink);background:#f3e7cf url(img/kraft.webp) center/cover;border:3px solid var(--ink);border-radius:20px;padding:26px 28px;min-height:230px;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:20px;align-items:center;box-shadow:6px 6px 0 var(--ink)}
@media(max-width:760px){.bcard{grid-template-columns:1fr}}
.bcard .hn{font-family:var(--hindi);font-weight:700;font-size:clamp(24px,2.8vw,36px);line-height:1.3}
.bcard .en{margin:10px 0 0;color:#4a4036;font-size:16px}
.tokdisc{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;margin:auto;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tokdisc svg{width:110px;height:110px}
.tokname{text-align:center;font-weight:700;margin-top:10px}
.wave{display:flex;align-items:center;gap:3px;height:40px}
.wave i{display:block;width:4px;border-radius:3px;background:var(--haldi);height:8px}
.wave.on i{animation:wv .9s ease-in-out infinite}
@keyframes wv{50%{height:34px}}
.caption{background:rgba(20,18,15,.82);color:#fff;border-radius:12px;padding:10px 14px;min-height:46px;font-size:19px;font-family:var(--hindi)}
.token{display:flex;align-items:center;gap:12px;background:var(--haldi);color:var(--ink);border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:600;box-shadow:4px 4px 0 var(--ink)}
.stage .btn{border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:12px}
.stage .btn[disabled]{opacity:.5}

function parseSentence(s) {
  const out = { needs: {}, size: null, langs: [] };
  const m = s.match(/(\d+)\s*(kids|children|students|bachche|बच्चे)/i); if (m) out.size = +m[1];
  ['Hindi', 'Bhojpuri', 'Maithili', 'Urdu', 'Bangla'].forEach(l => { if (new RegExp(l, 'i').test(s)) out.langs.push(l); });
  s.split(/,|;|\band\b|\.|\bplus\b/i).forEach(cl => {
    for (const k in NEED_RX) {
      if (!NEED_RX[k].test(cl)) continue;
      let n = 1; const d = cl.match(/\b(\d{1,2})\b(?!\s*(kids|children|students))/i);
      if (d) n = +d[1]; else { const w = cl.toLowerCase().match(/\b(one|two|three|four|five|six|seven|eight|nine|ten|ek|do|teen|char)\b/); if (w) n = NUMW[w[1]]; }
      if (k === 'lang' && /most|many|all/i.test(cl)) n = 1;
      out.needs[k] = Math.max(out.needs[k] || 0, n);
    }
  });
  return out;
}

      <div class="wave ${ST.playing ? 'on' : ''}" aria-hidden="true">${Array.from({ length: 28 }, (_, i) => `<i style="animation-delay:${(i % 7) * .09}s"></i>`).join('')}</div></div>

function lineChart() {
  const W = 560, H = 230, l = 44, r = 20, t = 20, b = 36, x = i => l + i * (W - l - r) / 11, y = v => t + (40 - v) / 40 * (H - t - b);
  const pts = LEARN.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  return S(W, H, `${[0, 10, 20, 30, 40].map(v => `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="${C.ink}" stroke-opacity=".15"/><text x="${l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" font-family="Schibsted Grotesk" fill="${C.muted}">${v}%</text>`).join('')}

}
function heatmap() {
  const mean = c => EVAL.reduce((a, r) => a + r[c], 0) / EVAL.length, base = mean(0);
  const ratio = LANGS.map((_, c) => mean(c) / base), ok = ratio.map(v => v >= .8);
  const shade = v => `rgba(38,51,140,${Math.max(.08, (v - 2.5) / 2.3).toFixed(2)})`;
  return `<div class="scroll"><table class="heat"><thead><tr><th>Need type</th>${LANGS.map((l, c) => `<th class="n">${l}${ok[c] ? '' : '<br><span class="nl">not launched</span>'}</th>`).join('')}</tr></thead><tbody>
    ${NEEDS.map((n, r) => `<tr><th scope="row">${n.en}</th>${EVAL[r].map((v, c) => `<td class="n ${ok[c] ? '' : 'off'}" style="${ok[c] ? `background:${shade(v)};color:${(v - 2.5) / 2.3 > .45 ? C.cream : C.ink}` : ''}">${v.toFixed(1)}</td>`).join('')}</tr>`).join('')}
    <tr class="ratio"><th scope="row">vs Hindi (4/5ths rule)</th>${ratio.map((v, c) => `<td class="n"><b>${Math.round(v * 100)}%</b> ${ok[c] ? '✓' : '✕'}</td>`).join('')}</tr></tbody></table></div>`;
}

function revChart() {

}
